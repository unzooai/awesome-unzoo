name: Validate and update software catalog

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/distribute.py check
      - name: Reject accidentally tracked installers and credentials
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          bad = [p for p in paths if p and (p.startswith('inbox/') and p != 'inbox/.gitkeep' or Path(p).suffix.lower() in {'.apk', '.aab', '.ipa', '.dmg', '.pkg', '.exe', '.msi', '.msix', '.appx', '.deb', '.rpm', '.appimage', '.zip', '.7z', '.rar', '.tar', '.gz', '.tgz', '.xz', '.bin', '.p12', '.pfx', '.pem', '.key', '.keystore', '.jks'})]
          if bad:
              raise SystemExit('Do not track installers or credentials: ' + ', '.join(bad))
          PY

  catalog:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Refresh from published releases
        run: python scripts/distribute.py sync
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh software download catalog'
            git push origin HEAD:main
          fi
